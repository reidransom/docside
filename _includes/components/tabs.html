{% assign tabs_content = include.content | strip %}
{% assign tabs_sync = include.sync | strip %}
{% assign tabs_persist = false %}
{% if include.persist == true and tabs_sync != '' %}{% assign tabs_persist = true %}{% endif %}
{% if tabs_content != '' %}<div class="docifly-tabs not-content" data-tabs{% if tabs_sync != '' %} data-tabs-sync="{{ tabs_sync | escape }}"{% endif %}{% if tabs_persist %} data-tabs-persist{% endif %}>{{ include.content }}</div>{% endif %}
